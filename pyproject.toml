[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcad-v3"
version = "3.0.0a2"
description = "Verifier-guided agentic CAD/CAE using typed engineering models, CadQuery, Gmsh and CalculiX"
requires-python = ">=3.11"
dependencies = [
  "cadquery>=2.8,<3",
  "pydantic>=2.12,<3",
  "langchain-core>=1.0,<2",
  "langgraph>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-openrouter>=0.2.8,<0.3",
  "python-dotenv>=1.0,<2",
  "gmsh>=4.13,<5",
  "streamlit>=1.45,<2",
  "plotly>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[project.scripts]
agentcad = "agentcad.cli:main"

[tool.setuptools.packages.find]
include = ["agentcad*"]

[tool.setuptools.package-data]
agentcad = ["llm/prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
